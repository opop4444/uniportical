version: 2.1

# Builds the uniportical image and publishes it to Docker Hub
# (docker.io/opop4444/uniportical) on main.
#
# Required CircleCI env vars (Project Settings -> Environment Variables):
#   DOCKERHUB_USERNAME = opop4444
#   DOCKERHUB_TOKEN    = a Docker Hub access token
#                        (hub.docker.com -> Account Settings -> Security -> New Access Token)

jobs:
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: |
            docker build \
              -t opop4444/uniportical:$CIRCLE_SHA1 \
              -t opop4444/uniportical:latest .
      - run:
          name: Smoke test — entrypoint script parses (don't push a broken image)
          command: docker run --rm --entrypoint bash opop4444/uniportical:$CIRCLE_SHA1 -n /usr/local/bin/uniportical
      - run:
          name: Login and push to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push opop4444/uniportical:$CIRCLE_SHA1
            docker push opop4444/uniportical:latest

workflows:
  publish:
    jobs:
      - build-and-push:
          # Publish only from main so feature branches don't overwrite :latest.
          # Delete this filter block to build + push on every branch.
          filters:
            branches:
              only: main
